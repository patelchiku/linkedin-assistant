<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LinkedIn Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f3f2ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 4px 20px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .brand {
      color: #0a66c2;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .25rem;
    }
    .brand-sub {
      color: #666;
      font-size: .85rem;
      margin-bottom: 2rem;
    }
    .btn-primary { background: #0a66c2; border-color: #0a66c2; }
    .btn-primary:hover { background: #004182; border-color: #004182; }
    .form-control:focus { border-color: #0a66c2; box-shadow: 0 0 0 .2rem rgba(10,102,194,.2); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><i class="bi bi-briefcase-fill"></i>LinkedIn Assistant</div>
    <div class="brand-sub">Sales Team Portal — Sign in to continue</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 mb-3" role="alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label fw-medium small text-muted">Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. palak"
               autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium small text-muted">Password</label>
        <input type="password" name="password" class="form-control"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
      </button>
    </form>
  </div>
</body>
</html>
